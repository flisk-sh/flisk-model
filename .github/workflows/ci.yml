name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # lib/validate.mjs grades with Flisk's own validator, read from a flisk checkout (cli/dist is committed).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: flisk-sh/flisk
          path: flisk
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check roadmap status statements
        run: node scripts/check-roadmap-status.mjs
      - name: Install the validator's dependencies
        run: npm install --prefix flisk/cli --ignore-scripts --no-audit --no-fund
      - run: npm test
        env:
          FLISK_REPO: ${{ github.workspace }}/flisk
